spring:
  application:
    name: salary-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${DB_USERNAME:salary_app}
    password: ${DB_PASSWORD:salary_local_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
